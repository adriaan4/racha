<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RACHA OBLIGATORIA 🔥</title>
  <meta name="theme-color" content="#3a0a5e" />
  <meta name="description" content="Que no se os olvide activar la racha de TikTok" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="RACHA 🔥" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- Splash de iOS (según el tamaño de pantalla) -->
  <link rel="apple-touch-startup-image" href="/splash/splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/splash/splash-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/splash/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/splash/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/splash/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/splash/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/splash/splash-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/splash/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/splash/splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/splash/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Splash de bienvenida -->
  <div class="splash" id="splash">
    <img src="/img/foto.jpg" alt="" width="720" height="720" />
    <div class="splash-title">RACHA<br /><span>OBLIGATORIA</span></div>
  </div>

  <div class="bg"></div>
  <div id="embers" aria-hidden="true"></div>

  <main class="app">
    <header class="top">
      <img class="logo" src="/icons/icon-192.png" alt="" width="64" height="64" />
      <h1>RACHA<br /><span>OBLIGATORIA</span></h1>
    </header>

    <button class="install" id="installBtn" hidden>📲 INSTALAR APP</button>

    <section class="streak">
      <div class="streak-num" id="streak">–</div>
      <div class="streak-label" id="streakLabel">días de racha</div>
      <div class="streak-best" id="best"></div>
    </section>

    <section class="summary" id="summary"></section>

    <section id="cards" class="cards"></section>

    <section class="foot">
      <button class="bell" id="bellBtn">🔔 Activar avisos en este móvil</button>
      <p class="hint" id="installHint" hidden></p>
      <p class="tiny" id="timesInfo"></p>
    </section>
  </main>

  <!-- ¿Quién usa este móvil? -->
  <div class="sheet-wrap" id="sheet" hidden>
    <div class="sheet">
      <h2>🔔 Avisos de racha</h2>
      <p id="sheetText">¿Quién usa este móvil?</p>
      <div class="sheet-btns" id="sheetChoose">
        <button class="pill" data-who="claudia">CLAUDIA</button>
        <button class="pill" data-who="carla">CARLA</button>
        <button class="pill" data-who="both">LAS DOS</button>
      </div>
      <div class="sheet-btns" id="sheetManage" hidden>
        <button class="pill" id="testBtn">📨 Probar aviso</button>
        <button class="pill ghost" id="offBtn">🔕 Desactivar</button>
      </div>
      <p class="tiny" id="sheetMsg"></p>
      <button class="close" id="sheetClose">Cerrar</button>
    </div>
  </div>

  <!-- Cómo instalar (iPhone / navegadores sin botón automático) -->
  <div class="sheet-wrap" id="installSheet" hidden>
    <div class="sheet">
      <h2>📲 Instalar la app</h2>
      <p id="installText"></p>
      <button class="close" id="installClose">Entendido</button>
    </div>
  </div>

  <!-- Misión cumplida -->
  <div class="win" id="win" hidden>
    <div class="win-inner">
      <div class="win-fire">🔥</div>
      <h2>🔥 MISIÓN CUMPLIDA.<br />LAS DOS HAN ACTIVADO LA RACHA 🔥</h2>
      <p class="win-streak" id="winStreak"></p>
      <button class="pill" id="winClose">¡Vamos! 😎</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
